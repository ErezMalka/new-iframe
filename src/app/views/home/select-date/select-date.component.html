  <div class="select-time-container animated fadeIn">

    <div *ngIf="isDelivery" [ngStyle]="{'direction':getLanguage() === 'en' ? 'ltr': 'rtl'}" class="row">

      <div class="col-3" [ngStyle]="{'text-align':getLanguage() === 'en' ? 'left': 'right'}">
        <img src="../../../assets/images/items/delivery-icon-new.svg" />
      </div>
      <div class="col-6">
        <div class="text-label-h2">בחר יום למשלוח </div>
      </div>
      <!--div class="col-6">
        <div class="text-label-h2">{{'HOME_OPTION_DELIVERY' | translate}} </div>
      </div-->

      <div class="col-3" [ngStyle]="{'text-align':getLanguage() === 'en' ? 'right': 'left'}" [ngClass]="{'direction': lang != 'he'}" (click)="close()"
        style="text-align: end; color: var(--orange); ">
        <i class="fa fa-times fa-lg"></i>
      </div>
    </div>

    <div *ngIf="isTA" [ngStyle]="{'direction':getLanguage() === 'en' ? 'ltr': 'rtl'}" class="row">

      <div class="col-3" [ngStyle]="{'text-align':getLanguage() === 'en' ? 'left': 'right'}">
        <img src="../../../assets/images/items/TA-icon-new.svg" />
      </div>

      <div class="col-6">
        <div class="text-label-h2">{{'HOME_OPTION_TAKE_AWAY' | translate}} </div>
      </div>

      <div class="col-3 " [ngStyle]="{'text-align':getLanguage() === 'en' ? 'right': 'left'}" [ngClass]="{'direction': lang != 'he'}" (click)="close()"
        style="text-align: end; color: var(--orange); ">
        <i class="fa fa-times fa-lg" ></i>
      </div>
    </div>

    <div *ngIf="!branchOpen" style="margin-top: 12px;"></div>

    <div
      style="border-bottom: 1px dashed #CECECE; margin-right: -14px; margin-left: -15px; margin-top: 16px; margin-bottom: 10px;">
    </div>

    <div class="time-selection" style="margin-bottom: -13px;">

      <div class="row">

            <mat-dialog-content class="mat-dialog-content-custom">
    
    
              <ng-container *ngFor="let day of futureDates; let $index=index">
                <div *ngIf="day.Date==selectedDay.Date" class="d-none d-lg-flex row item noselect" [ngClass]="{'selected': isDateSelected}"
                  (click)="isDateSelected=true; selectedDay=day;">
    
                  <div style="position: relative;"> 
                    <i style=" position: absolute; left: -8px; top: 9px; transform: rotate(90deg); color: var(--orange); font-size: 40px;" class="fa fa-sort-down fa-lg"></i>
                  </div>
    
                  <!--div class="d-flex d-lg-none" style="position: relative;">

                  </div-->
    
                  <div class="d-none d-lg-flex" style="position: relative;">
                    <i style=" position: absolute; left: -529px; top: 9px; transform: rotate(270deg); color: var(--orange); font-size: 40px;" class="fa fa-sort-down fa-lg"></i>
                  </div>
                  
                  <div class="col-12" style="align-self: center;"><b>{{day.DayOfWeekName}} ({{day.Date}})</b></div>
    
                </div>
    
                <div *ngIf="day.Date!=selectedDay.Date" class="d-none d-lg-flex row item noselect" [ngClass]="{'selected': isDateSelected}"
                  (click)="isDateSelected=true; selectedDay=day;">
                  <div class="col-12" style="align-self: center;">
                    {{day.DayOfWeekName}} ({{day.Date}})
                  </div>
                </div>

                <div *ngIf="day.Date==selectedDay.Date" class=" d-flex d-lg-none row item-mobile noselect" [ngClass]="{'selected': isDateSelected}"
                  (click)="isDateSelected=true; selectedDay=day;">
    
                  <div style="position: relative;"> 
                    <i style=" position: absolute; left: -8px; top: 20px; transform: rotate(90deg); color: var(--orange); font-size: 40px;" class="fa fa-sort-down fa-lg"></i>
                  </div>
    
                  <div class="d-flex d-lg-none" style="position: relative;">
                    <i style=" position: absolute; left: -289px; top: 20px; transform: rotate(270deg); color: var(--orange); font-size: 40px;" class="fa fa-sort-down fa-lg"></i>
                  </div>

                    <i style=" position: absolute; left: -255px; top: 9px; transform: rotate(270deg); color: var(--orange); font-size: 40px;" class="fa fa-sort-down fa-lg"></i>
                  </div-->
                  
                  <div class="col-12" style="align-self: center;">
                    <b>
                      {{day.DayOfWeekName}} ({{day.Date}})
                    </b>
                  </div>
    
                </div>
    
                <div *ngIf="day.Date!=selectedDay.Date" class="d-flex d-lg-none row item-mobile noselect" [ngClass]="{'selected': isDateSelected}"
                  (click)="isDateSelected=true; selectedDay=day;">
                  <div class="col-12" style="align-self: center;">
                    {{day.DayOfWeekName}} ({{day.Date}})
                  </div>
                </div>
    
    
              </ng-container>
    
     
            </mat-dialog-content>
          </div>
        </div>

      </div>

     


    </div>

    <ng-container *ngIf="displayFutureDeliveryOptions">
      <div class="dotted-line"></div>
      <div class="row py-2">
        <div class="col-3" > </div>
        <div class="col" style="font-size:20px;">זמן מועדף</div>
        <div class="col-3" > </div>
         
      </div>
      <div class="row py-1" *ngFor="let o of options">
        <div class="col-3 d-none d-lg-flex" > </div>
        <div class="col " >
          <i *ngIf="!o.selected" class="fa fa-square-o fa-lg"  
              aria-hidden="true" (click)="selectOption(o);"></i>
          <i *ngIf="o.selected" class="fa fa-check-square fa-lg" style="color: var(--orange);"
             aria-hidden="true" ></i>
         <!--input   id="inline-check-o" type="checkbox" 
                [(ngModel)]="o.selected"  (click)="selectOption(o);"-->
            <label class="text-label-h2 ml-1" for="inline-check-o">
              {{o.option}}
            </label>
        </div>
        <div class="col-3  d-none d-lg-flex"  > </div>
      </div>
