 

<loader [show]="!loaded"></loader>

<ng-container *ngFor="let category of categories">
  <ng-container *ngFor="let item of category.Items">
    <img [src]="item?.ImageUrl" style="display:none;" />       
  </ng-container>
</ng-container>
<!--ng-container *ngFor="let top of pizzaToppings">
  <img [src]="top?.ImageUrl" style="display:none;" />
  <img [src]="top?.QuarterPizzaImageUrl" style="display:none;" />
</ng-container-->
 

<div *ngIf="loaded" class="animated fadeIn container-fluid pl-3" 
     [ngStyle]="{'background-color': bgColor}">
  <div class="row" style="margin-left: 0;margin-right: 0;">
    <ng-container *ngFor="let page of pages; let $index = index;">
      <ng-container *ngIf="$index === currentPageIndex">
        <!--div class="row"-->
          <div *ngFor="let column of page; let $i = index;" class="col" [ngClass]="'columns-' + $i">
            <ng-container *ngFor="let item of column">
              <div *ngIf="item.CategoryName" class="category-card">
                <div class="cat-details" [ngStyle]="{'text-align':getLanguage() === 'en' ? 'left': 'right'}">
                  <div class="row">
                    <div class="col cat-name">
                      <b> {{ item.CategoryName }}</b>
                    </div>
                  </div>
                  <div *ngIf="item.CategoryDesc != null && item.CategoryDesc != undefined && item.CategoryDesc > 0" class="row" style=" font-size: 16px;"
                        class="row">
                        <div class="col cat-desc">
                          <b> {{ item.CategoryDesc }}</b>
                        </div>
                  </div>
                </div>
               
              </div>
             
              <div *ngIf="item.Name" class="item-card my-items">
                <div class="product-image">
                  <img class="p-img" [src]="item?.ImageUrl" (error)="logo($event)" alt="" />
                </div>
                <div class="product-details" [ngStyle]="{'text-align':getLanguage() === 'en' ? 'left': 'right'}">
                  <div class="row">
                    <div class="col product-name" *ngIf="!item.IsCombo">
                      <b>{{item?.Name}}</b>
                    </div>
                    <div class="col product-name" *ngIf="item.IsCombo">
                      <b>  {{item?.Name}} (1+1) </b> 
                    </div>
                  </div>
                  <div class="row">
                    <div *ngIf="item?.Information != 'undefined' &&  item?.Information != null" class="col product-desc">
                      {{item?.Information}}
                    </div>
                  </div>
                  <div class="row" *ngIf="item && item.Price">
                    <div class="product-price" [ngStyle]="{'right':getLanguage() === 'en' ? '0': '', 'left':getLanguage() === 'he' ? '0': '', 'border-radius':getLanguage() === 'he' ? '0px 5px': '5px 0px' }">
                      <span style="font-size: 1.5rem;">{{item?.Price}}</span>
                      <span>{{"COMMON_CASH" | translate}}</span>
                    </div>
                  </div>
                </div>
    
              </div>
             
            </ng-container>
            
            
          </div>
          <div *ngIf="page.length == 1" class="col columns-1"></div>
        <!--/div-->
      </ng-container>
    </ng-container>
  <!--/div-->
  <ng-container *ngIf="tvHalfScreenImg">
    <div *ngIf="!playVideo" class="col-6">
      <carousel [itemsPerSlide]="1">
        <slide *ngFor="let slide of images; let index=index">
          <img [src]="slide" alt="image slide" style="display: block; width: 100%; height: 100dvh;">
        </slide>
      </carousel>
    </div>
    <div *ngIf="playVideo" class="col-6">
      <div style=" display:flex; height:100dvh; width:100%; justify-content: stretch;">
        <video onloadedmetadata="this.muted=true" class="video-fluid" autoplay loop controls muted>
          <source src="{{videoPath}}" type="video/mp4" />
        </video>
      </div>
      
    </div>

  </ng-container>
  <ng-container *ngIf="!tvHalfScreenImg">
    <div *ngIf="!playVideo" class="col-4">
      <carousel [itemsPerSlide]="1">
        <slide *ngFor="let slide of images; let index=index">
          <img [src]="slide" alt="image slide" style="display: block; width: 100%; height: 100dvh;">
        </slide>
      </carousel>
    </div>
    <div *ngIf="playVideo" class="col-4">
      <div style=" display:flex; height:100dvh; width:100%; justify-content: stretch;">
        <video onloadedmetadata="this.muted=true" class="video-fluid" autoplay loop controls muted>
          <source src="{{videoPath}}" type="video/mp4" />
        </video>
      </div>
      
    </div>

  </ng-container>
   
  </div>
  
  
  
  
</div>
