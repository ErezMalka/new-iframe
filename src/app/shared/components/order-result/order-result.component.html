<div class="order">
  <div class="count-remove-options" [ngClass]="{'direction': lang != 'he'}">
    <div class="count">
      <img src="../../../assets/images/items/order.svg"/>
      <span>{{"MENU_ITEMS" | translate}} {{countOfItems()}} </span>
    </div>
    <div class="remove-btn" *ngIf="!isMobileMode()">
      <span (click)="removeAllOrder()">{{"MENU_CLEAR" | translate}}</span>
    </div>
  </div>
  <div class="order-sum-option">
    <div class="total-payment">
      <span class="total-payment" *ngIf="!isMobileMode()">{{"MENU_TOTAL_PAYMENT" | translate}}</span>
      <span class="total-payment-price" *ngIf="order && order.Sum >= 0">{{order.Sum}} {{"COMMON_CASH" | translate}}</span>
    </div>
    <div class="order-btn">
      <button (click)="toMakeOrder()">
        <img src="../../../assets/images/items/check.svg">
        <span>{{"MENU_ORDER" | translate}}</span>
      </button>
    </div>
  </div>
</div>
<div class="order animated fadeIn" (window:resize)="onResize($event)" *ngIf="isMobileMode() && (order.Sum > 0 || countOfItems() > 0)">
  <div class="order-sum-option"  *ngIf="isMobileMode()">
    <div class="total-payment">
      <span class="total-payment" [ngStyle]="{'color': colors.buttonColor}">{{"MENU_TOTAL_PAYMENT" | translate}}</span>
      <span class="total-payment-price" [ngStyle]="{'color': colors.buttonColor}" *ngIf="order && order.Sum >= 0">{{roundSum(order.Sum, 2) }} {{"COMMON_CASH" | translate}}</span>
    </div>
    <div class="order-btn">
      <button (click)="toMakeOrder()" class="scale-item" [ngStyle]="{'background-color': colors.menuColor}">
        <img src="../../../assets/images/items/check.svg">
        <span>{{"MENU_ORDER" | translate}}</span>
      </button>
    </div>
  </div>
</div>
