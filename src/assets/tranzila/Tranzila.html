	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<title>Tranzila Direct iFrame</title>
		<meta name="description" content="Tranzila Direct iframe payment form">
		<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
		<script>
			var date = new Date();
			var year = date.getFullYear();
			var month = date.getMonth() + 1;

			var validate = { credit: false, date: false, id: false, cvv: false };


			$('document').ready(function () {
				var $el = $("#expyear");
				$el.empty();
				for (var i = 0; i < 7; i++) {
					$el.append($("<option></option>")
						.attr("value", (year % 100) + i).text(year + i));
				};

				//check date input:
				$('select').on('keyup blur', function () {
					var expYear = $('#expyear').val();
					if (expYear == (year % 100)) {
						var expMonth = $(this).val();
						if (expMonth < month) {
							$('#errorMsgDate').text("האשראי פג תוקף!");
							validate.date = false;
						}
						else {
							$('#errorMsgDate').text("");
							validate.date = true;
						}
					}
					else {
						$('#errorMsgDate').text("");
						validate.date = true;
					}
				});
				//check Id input:
				$('#myid').on('keyup blur',function () {
					if ($.trim($(this)).length > 0) {
						var tot = 0;
						var tz = new String($(this).val());
						for (i = 0; i < 8; i++) {
							x = (((i % 2) + 1) * tz.charAt(i));
							if (x > 9) {
								x = x.toString();
								x = parseInt(x.charAt(0)) + parseInt(x.charAt(1))
							}
							tot += x;
						}

						if ((tot + parseInt(tz.charAt(8))) % 10 !== 0) {
							$('#errorMsgId').text("מספר ת.ז. לא תקין!");
							validate.id = false;
						}
						else {
							$('#errorMsgId').text("");
							validate.id = true;
						}
					}
					else {
						$('#errorMsgId').text("שדה חובה");
						validate.id = false;
					}
				});

				//check credit card input:
				$('#ccno').on('keyup blur',function () {
					if ($.trim($(this).val()).length > 2) {
						var creditCard = new String($(this).val());
						if (creditCard.length == 8 || creditCard.length == 9) {
							checkShortCreditNumber(creditCard);
						}
						else {
							var checkCreditCompany = parseInt(creditCard[0]) * 10 + parseInt(creditCard[1]);
							switch (checkCreditCompany) {
								case 30:
								case 36:
								case 38:
									$("#ccno").removeClass("mastercardImg amexImg visaImg").addClass("dinersImg");
									checkCreditNumber(creditCard);
									break;
								case 34:
								case 37:
									$("#ccno").removeClass("mastercardImg visaImg dinersImg").addClass("amexImg");
									checkCreditNumber(creditCard);
									break;
								case 45:
									$("#ccno").addClass("visaImg");
									checkCreditNumber(creditCard);
									break;
								case 51:
								case 52:
								case 53:
								case 54:
								case 55:
									$("#ccno").removeClass("visaImg dinersImg amexImg").addClass("mastercardImg");
									checkCreditNumber(creditCard);
									break;
								default:
									$('#errorMsgCreditCard').text("מספר כרטיס אשראי לא תקין!");
									validate.credit = false;
							}
						}
					}
					else {
						$('#errorMsgCreditCard').text("שדה חובה");
						validate.credit = false;
					}
				});

				//check cvv input:
				$('#mycvv').on('keyup blur',function () {
					if ($.trim($(this).val()).length > 0) {
						var cvv = $(this).val();
						var ccvNum = parseInt(cvv);
						if (cvv.length != 3 || ccvNum == 0) {
							$('#errorMsgCVV').text("שדה חובה");
							validate.cvv = false;
						}
						else {
							$('#errorMsgCVV').text("");
							validate.cvv = true;
						}
					}
					else {
						$('#errorMsgCVV').text("שדה חובה");
						validate.cvv = false;
					}
				});


				//keychanges:
				$('.inputs').keydown(function (e) {
					if (e.which === 13) {
						var index = $('.inputs').index(this) + 1;
						$('.inputs').eq(index).focus();
					}
				});

					$('input').on('keyup blur',function () {
					if (validate.credit === true && validate.date === true && validate.id === true && validate.cvv === true)
						$('#submitbtn').attr("disabled", false);
					else
						$('#submitbtn').attr("disabled", true);
				});


				$('select').on('keyup blur',function () {
					if (validate.credit === true && validate.date === true && validate.id === true && validate.cvv === true)
						$('#submitbtn').attr("disabled", false);
					else
						$('#submitbtn').attr("disabled", true);
				});
			});



			//helpers:
			function checkCreditNumber(creditCard) {
				var tot = 0;
				creditCard = creditCard.split("").reverse().join("");
				for (i = 0; i < 19; i++) {
					x = (((i % 2) + 1) * creditCard.charAt(i));
					if (x > 9) {
						x = x.toString();
						x = parseInt(x.charAt(0)) + parseInt(x.charAt(1))
					}
					tot += x;
				}

				if (tot % 10 !== 0) {
					$('#errorMsgCreditCard').text("מספר כרטיס אשראי לא תקין!");
					validate.credit = false;
				}
				else {
					$('#errorMsgCreditCard').text("");
					validate.credit = true;
				}
			};

			function checkShortCreditNumber(creditCard) {
				var tot = 0;
				creditCard = creditCard.split("").reverse().join("");
				for (i = 0; i < 9; i++) {
					x = ((i + 1) * creditCard.charAt(i));
					if (x > 9) {
						x = x.toString();
						x = parseInt(x.charAt(0)) + parseInt(x.charAt(1))
					}
					tot += x;
				}

				if (tot % 11 !== 0) {
					$('#errorMsgCreditCard').text("מספר כרטיס אשראי לא תקין!");
					validate.credit = false;
				}
				else {
					$("#ccno").removeClass("amexImg visaImg dinersImg").addClass("mastercardImg");
					$('#errorMsgCreditCard').text("");
					validate.credit = true;
				}
			};
		</script>
